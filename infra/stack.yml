# Stack "manutencao": o sistema inteiro, sem depender de serviço externo.
#
#   internet ─► traefik ─► app (Next.js) ─► rest (PostgREST) ─► db (PostgreSQL)
#                            │                    ▲
#                            └─► whatsapp ────────┘   (Baileys, sempre ligado)
#
#   migrador  aplica o SQL a cada deploy e termina
#   cron      chama a rotina do WhatsApp de hora em hora
#   backup    copia banco e arquivos todo dia (e manda para o Backblaze B2)
#   atualizador  aplica a versão nova quando o superadmin clica em "Atualizar"
#
# Variáveis: infra/.env (modelo em infra/.env.exemplo). Subir: infra/deploy.sh

version: "3.8"

x-log: &log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-banco: &banco
  PGHOST: db
  PGUSER: postgres
  PGDATABASE: manutencao
  PGPASSWORD: ${POSTGRES_PASSWORD}

services:
  # --- Banco ------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manutencao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=2000
    volumes:
      - db_dados:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manutencao"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *log
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first

  # Aplica db/sql/*.sql (idempotente) e termina. Roda de novo a cada deploy.
  migrador:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/ops:${TAG:-latest}
    command: ["migrar"]
    environment:
      <<: *banco
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      # Login do superadmin (painel /admin). Criado/atualizado a cada deploy.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_SENHA: ${SUPERADMIN_SENHA:-}
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 20

  # API do banco, só na rede interna (não é exposta na internet).
  rest:
    image: postgrest/postgrest:v14.13
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/manutencao
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_POOL: "20"
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: warn
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1
      update_config:
        order: start-first

  # --- Aplicação ----------------------------------------------------------------
  app:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/app:${TAG:-latest}
    environment:
      SITE_URL: https://${DOMINIO}
      POSTGREST_URL: http://rest:3000
      JWT_SECRET: ${JWT_SECRET}
      SESSAO_SECRET: ${SESSAO_SECRET}
      ARQUIVOS_SECRET: ${ARQUIVOS_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      WHATSAPP_API_URL: http://whatsapp:3000
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      ARQUIVOS_DIR: /dados/arquivos
      ARQUIVOS_COTA_MB: ${ARQUIVOS_COTA_MB:-5120}
    volumes:
      - arquivos:/dados/arquivos
    networks: [interna, rede_publica]
    logging: *log
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=rede_publica
        - traefik.http.routers.manutencao.rule=Host(`${DOMINIO}`)
        - traefik.http.routers.manutencao.entrypoints=websecure
        - traefik.http.routers.manutencao.tls.certresolver=letsencrypt
        - traefik.http.routers.manutencao.middlewares=manutencao-compressao
        - traefik.http.middlewares.manutencao-compressao.compress=true
        - traefik.http.services.manutencao.loadbalancer.server.port=3000
        # Envio dos formulários de login, cadastro e recuperação (só POST: abrir
        # a tela não conta): no máximo ~2 por segundo por IP (rajada de 60). O
        # app ainda tem o limite por conta; isto segura robôs antes de chegarem
        # a ele (cada senha conferida custa CPU). Escritório atrás de um IP só
        # cabe folgado.
        - traefik.http.routers.manutencao-auth.rule=Host(`${DOMINIO}`) && (Path(`/login`) || Path(`/cadastro`) || Path(`/recuperar-senha`) || PathPrefix(`/auth/`)) && Method(`POST`)
        - traefik.http.routers.manutencao-auth.entrypoints=websecure
        - traefik.http.routers.manutencao-auth.tls.certresolver=letsencrypt
        - traefik.http.routers.manutencao-auth.service=manutencao
        - traefik.http.routers.manutencao-auth.middlewares=manutencao-auth-limite,manutencao-compressao
        - traefik.http.middlewares.manutencao-auth-limite.ratelimit.average=120
        - traefik.http.middlewares.manutencao-auth-limite.ratelimit.period=1m
        - traefik.http.middlewares.manutencao-auth-limite.ratelimit.burst=60

  # WhatsApp (Baileys). UMA cópia só: duas com a mesma sessão se derrubam.
  whatsapp:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/whatsapp:${TAG:-latest}
    environment:
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      POSTGREST_URL: http://rest:3000
      # Sem JWT_SECRET: o token do banco (papel whatsapp_servico) vem do app.
      APP_URL: http://app:3000
      WHATSAPP_SEMPRE_ONLINE: ${WHATSAPP_SEMPRE_ONLINE:-true}
      WHATSAPP_DIGITANDO: ${WHATSAPP_DIGITANDO:-true}
      WHATSAPP_REJEITAR_CHAMADAS: ${WHATSAPP_REJEITAR_CHAMADAS:-false}
      TZ: America/Sao_Paulo
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  # --- Tarefas ------------------------------------------------------------------
  cron:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/ops:${TAG:-latest}
    command: ["cron"]
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1

  backup:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/ops:${TAG:-latest}
    command: ["backup"]
    environment:
      <<: *banco
      BACKUP_DIAS: ${BACKUP_DIAS:-14}
      BACKUP_HORA: ${BACKUP_HORA:-3}
      ARQUIVOS_DIR: /dados/arquivos
      # Cópia fora do servidor no Backblaze B2. Prefira o console do superadmin
      # (Gerência → Integrações); estas variáveis só valem com o console vazio.
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_PASTA: ${B2_PASTA:-manutencao}
      B2_DIAS: ${B2_DIAS:-30}
      B2_SENHA_CRIPTOGRAFIA: ${B2_SENHA_CRIPTOGRAFIA:-}
    volumes:
      - backups:/backups
      - arquivos:/dados/arquivos:ro
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  # Botão "Atualizar" do painel do superadmin: lê o pedido no banco e troca a
  # tag das imagens app/whatsapp/ops desta stack. Tem o socket do Docker, por
  # isso NÃO fica na rede pública e não abre porta nenhuma (só fala com o banco).
  atualizador:
    image: ${IMAGEM_BASE:-ghcr.io/dhqdev/manutencao-ativos}/ops:${TAG:-latest}
    command: ["atualizador"]
    environment:
      <<: *banco
      ATUALIZADOR_SERVICO: "{{.Service.Name}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [interna]
    logging: *log
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first

networks:
  interna:
    driver: overlay
    attachable: true
  rede_publica:
    external: true

volumes:
  db_dados:
  arquivos:
  backups:
