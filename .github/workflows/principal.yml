# Build, testes e publicação.
#
# Roda em todo push, de qualquer branch: assim dá para validar
# uma mudança num branch ANTES de ela chegar na main. Publicar imagens, criar
# release e fazer deploy acontecem só na main e só com tudo verde.
#
#   1. verificar  tipos, build do Next e testes do serviço de WhatsApp
#   2. stack      monta as 3 imagens (linux/arm64), sobe a stack inteira num
#                 Docker Swarm, verifica segurança/cron/banco/backup, roda o
#                 teste ponta a ponta no Chromium e, se tudo passar, publica
#                 as imagens no GitHub Container Registry
#   3. release    cria a release do GitHub (vAAAA.MM.DD-N) com notas dos
#                 commits, tags das imagens e o pacote infra/ anexado
#   4. deploy     (opcional) atualiza o servidor por SSH — liga sozinho quando
#                 a variável DEPLOY_HOST estiver configurada no repositório
#
# Tudo roda em runner ARM64 nativo (mesma arquitetura da Oracle Ampere).

name: principal

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Na main os runs entram em fila (cada um vira uma release). Nos outros
# branches, um push novo cancela o run anterior do mesmo branch.
concurrency:
  group: principal-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGEM_BASE: ghcr.io/${{ github.repository }}

jobs:
  verificar:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` estrito: lock fora de sincronia quebra aqui, com mensagem
      # clara, em vez de passar e gerar uma imagem diferente do que foi testado.
      - name: Dependências do app
        run: npm ci --no-audit --no-fund

      # Mesmo script do pre-push local (.githooks/pre-push): o que passa na
      # máquina passa aqui, e vice-versa.
      - name: Verificação (lock, tipos, build, WhatsApp, shell)
        run: scripts/verificar.sh

  stack:
    needs: verificar
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.sha }}
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: versao
        run: echo "versao=v$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Imagem app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGEM_BASE }}/app:${{ env.TAG }}
          build-args: VERSAO=${{ steps.versao.outputs.versao }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Imagem whatsapp
        uses: docker/build-push-action@v6
        with:
          context: whatsapp
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGEM_BASE }}/whatsapp:${{ env.TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=whatsapp
          cache-to: type=gha,scope=whatsapp,mode=max

      - name: Imagem ops (migrador, cron, backup)
        uses: docker/build-push-action@v6
        with:
          context: db
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGEM_BASE }}/ops:${{ env.TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,scope=ops,mode=max

      - name: Subir a stack num Swarm de teste
        run: |
          docker swarm init
          testes/gerar-env-teste.sh > infra/.env
          echo "127.0.0.1 manutencao.localhost traefik.localhost" | sudo tee -a /etc/hosts
          RESOLVER_IMAGEM=never infra/deploy.sh

      - name: Esperar tudo ficar de pé
        run: |
          for i in $(seq 1 90); do
            if curl -sk --max-time 5 "https://manutencao.localhost/api/saude?banco=1" | grep -q '"banco":"ok"'; then
              echo "No ar depois de $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "A stack não ficou de pé a tempo."; exit 1

      - name: Verificações da stack
        run: testes/verificar-stack.sh

      - name: Teste ponta a ponta (Chromium)
        working-directory: testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          BASE_URL=https://manutencao.localhost node e2e.mjs

      - name: Diagnóstico (se falhou)
        if: failure()
        run: |
          docker stack services manutencao || true
          for s in $(docker stack services manutencao --format '{{.Name}}') traefik_traefik; do
            echo "::group::$s"
            docker service ps --no-trunc "$s" || true
            docker service logs --tail 200 "$s" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Prints do teste (se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: testes/resultados/
          if-no-files-found: ignore

      - name: Publicar imagens no GHCR (só na main, com tudo verde)
        if: github.ref == 'refs/heads/main'
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for imagem in app whatsapp ops; do
            for etiqueta in "$VERSAO" latest; do
              docker tag "$IMAGEM_BASE/$imagem:$TAG" "$IMAGEM_BASE/$imagem:$etiqueta"
            done
            for etiqueta in "$TAG" "$VERSAO" latest; do
              docker push "$IMAGEM_BASE/$imagem:$etiqueta"
            done
          done

  release:
    needs: stack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSAO: ${{ needs.stack.outputs.versao }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pacote de instalação
        run: |
          pasta="manutencao-$VERSAO"
          mkdir -p "pacote/$pasta/infra"
          cp infra/stack.yml infra/portainer.yml infra/traefik.yml infra/deploy.sh infra/preparar-servidor.sh infra/.env.exemplo "pacote/$pasta/infra/"
          cp INSTALACAO.md WHATSAPP.md SEGURANCA.md "pacote/$pasta/"
          tar -czf "infra-$VERSAO.tar.gz" -C pacote "$pasta"

      - name: Criar a release
        run: |
          {
            echo "Versão testada no GitHub Actions: build ARM64, stack completa num Docker Swarm de teste e teste ponta a ponta no navegador."
            echo
            echo "## Imagens (linux/arm64)"
            echo
            for imagem in app whatsapp ops; do
              echo "- \`$IMAGEM_BASE/$imagem:$VERSAO\`"
            done
            echo
            echo "## Instalar ou atualizar esta versão"
            echo
            echo '```bash'
            echo "cd /opt/manutencao/infra && TAG=$VERSAO ./deploy.sh"
            echo '```'
            echo
            echo "Commit: $GITHUB_SHA · Guia: INSTALACAO.md (também no pacote anexo)."
          } > notas.md
          gh release create "$VERSAO" "infra-$VERSAO.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "$VERSAO" \
            --notes-file notas.md \
            --generate-notes \
            --latest

  deploy:
    needs: stack
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - name: Chave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" > ~/.ssh/known_hosts
          fi

      - name: Atualizar o servidor
        env:
          DESTINO: ${{ vars.DEPLOY_USUARIO || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
          PASTA: ${{ vars.DEPLOY_PASTA || '/opt/manutencao' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes"
          $SSH "$DESTINO" "mkdir -p $PASTA/infra"
          scp -i ~/.ssh/deploy -o IdentitiesOnly=yes infra/stack.yml infra/traefik.yml infra/deploy.sh "$DESTINO:$PASTA/infra/"
          $SSH "$DESTINO" "cd $PASTA/infra && chmod +x deploy.sh && TAG=${{ github.sha }} ./deploy.sh"
